<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wolfie's Street Food | Περιστέρι</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #e50914;
    color: #ffffff;

    display: flex;
    justify-content: center;

    padding: 28px 18px 35px;

    position: relative;
    overflow-x: hidden;
}


/* =========================
   SUBTLE BACKGROUND CSS
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 12% 18%,
            rgba(255,255,255,0.12) 0px,
            rgba(255,255,255,0.12) 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(255,255,255,0.09) 0px,
            rgba(255,255,255,0.09) 1px,
            transparent 2px
        ),

        linear-gradient(
            135deg,
            transparent 0%,
            transparent 48%,
            rgba(255,255,255,0.035) 49%,
            transparent 50%,
            transparent 100%
        );

    background-size:
        290px 290px,
        350px 350px,
        100% 100%;

    z-index: 0;
}


/* =========================
   SOFT BACKGROUND GLOW
========================= */

body::after {
    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    top: -180px;
    right: -160px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.10),
            transparent 70%
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    text-align: center;

    position: relative;
    z-index: 1;
}


/* =========================
   LOGO
========================= */

.logo-wrapper {
    width: 100%;
    height: 320px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 8px;
}

.logo {
    width: 100%;
    max-width: 400px;

    max-height: 310px;

    object-fit: contain;

    display: block;
}


/* =========================
   ADDRESS
========================= */

.address {
    font-size: 14px;

    font-weight: 600;

    color: #ffffff;

    margin-top: 5px;
    margin-bottom: 18px;

    letter-spacing: 0.3px;
}


/* =========================
   DIVIDER
========================= */

.divider {
    width: 60px;
    height: 2px;

    margin: 0 auto 27px;

    background: #ffffff;

    border-radius: 20px;

    opacity: 0.85;
}


/* =========================
   BUTTON CONTAINER
========================= */

.buttons {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}


/* =========================
   BUTTON
========================= */

.btn {
    width: 100%;

    min-height: 64px;

    display: flex;

    align-items: center;
    justify-content: flex-start;

    padding: 15px 20px;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.2px;

    background: #d90812;

    border: 2px solid #ffffff;

    border-radius: 14px;

    box-shadow:
        0 6px 16px rgba(0,0,0,0.15);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}


/* =========================
   BUTTON HOVER
========================= */

.btn:hover {
    background: #c80711;

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(0,0,0,0.20);
}


/* =========================
   BUTTON ACTIVE
========================= */

.btn:active {
    transform: scale(0.98);
}


/* =========================
   ICON
========================= */

.icon {
    width: 42px;
    min-width: 42px;

    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-right: 15px;

    color: #ffffff;
}

.icon svg {
    width: 28px;
    height: 28px;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.9;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================
   BUTTON TEXT
========================= */

.btn-text {
    flex: 1;

    text-align: left;

    color: #ffffff;
}


/* =========================
   FOOTER LINE
========================= */

.footer-line {
    display: flex;

    align-items: center;
    justify-content: center;

    margin-top: 33px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #ffffff;

    opacity: 0.65;
}

.footer-symbol {
    margin: 0 12px;

    color: #ffffff;

    font-size: 13px;
}


/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 14px;

    font-size: 11px;

    color: rgba(255,255,255,0.75);

    letter-spacing: 1.3px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding:
            20px
            16px
            30px;
    }

    .logo-wrapper {
        height: 290px;
    }

    .logo {
        max-width: 370px;
        max-height: 280px;
    }

    .address {
        font-size: 13px;
    }

    .btn {
        min-height: 62px;

        padding:
            14px
            17px;

        font-size: 14px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .logo-wrapper {
        height: 255px;
    }

    .logo {
        max-width: 330px;
        max-height: 245px;
    }

    .btn {
        min-height: 58px;

        padding:
            13px
            14px;

        font-size: 13.5px;
    }

    .icon {
        width: 36px;
        min-width: 36px;

        height: 36px;

        margin-right: 11px;
    }

    .icon svg {
        width: 25px;
        height: 25px;
    }

}

</style>
</head>
